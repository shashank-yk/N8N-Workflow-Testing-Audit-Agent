[project]
name = "personal-n8n-qa-agent"
version = "0.1.0"
description = "Telegram-controlled personal QA agent for testing n8n workflows."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13.1",
  "browser-use>=0.1.40",
  "google-generativeai>=0.8.3",
  "httpx>=0.27.2",
  "langgraph>=0.2.39",
  "playwright>=1.48.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
